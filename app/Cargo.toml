[package]
name = "tansu"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tansu - a floating shelf for files, text and images (Linux/GNOME)"

[dependencies]
tansu-core = { path = "../core" }
gtk4 = { version = "0.10", features = ["v4_8"] }
serde_json = "1"
libadwaita = { version = "0.8", features = ["v1_7"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk4-layer-shell = { version = "0.6", optional = true }

[features]
layer-shell = ["dep:gtk4-layer-shell"]
